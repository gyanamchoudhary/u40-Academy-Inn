<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,follow" />
    <meta name="theme-color" content="#071a2d" />
    <link rel="icon" type="image/svg+xml" href="/assets/u40-mark.svg" />
    <title>Page Not Found | U40 Academy Inn</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #071a2d;
        color: #fff;
        font-family:
          Manrope,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background-image:
          linear-gradient(rgba(217, 246, 111, 0.055) 1px, transparent 1px),
          linear-gradient(
            90deg,
            rgba(217, 246, 111, 0.055) 1px,
            transparent 1px
          );
        background-size: 3.5rem 3.5rem;
      }
      main {
        width: min(100%, 58rem);
        border-top: 1px solid rgba(255, 255, 255, 0.22);
        padding-top: clamp(2rem, 8vw, 6rem);
      }
      .eyebrow {
        color: #d9f66f;
        font:
          700 0.68rem/1.4 ui-monospace,
          monospace;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      h1 {
        max-width: 10ch;
        margin: 1.4rem 0 0;
        font-size: clamp(3.8rem, 10vw, 8.5rem);
        line-height: 0.88;
        letter-spacing: -0.07em;
      }
      p {
        max-width: 35rem;
        margin: 2rem 0 0;
        color: rgba(255, 255, 255, 0.68);
        font-size: 1.05rem;
        line-height: 1.8;
      }
      a {
        display: inline-flex;
        min-height: 3.25rem;
        align-items: center;
        margin-top: 2rem;
        padding: 0 1.4rem;
        background: #d9f66f;
        color: #111318;
        font-weight: 800;
        text-decoration: none;
      }
      a:hover,
      a:focus-visible {
        background: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">404 · Page not found</div>
      <h1>This page has left campus.</h1>
      <p>
        The address may have changed or the page may no longer exist. Return to
        U40 Academy Inn to explore programs, residential life and admissions.
      </p>
      <a href="/">Return to the homepage&nbsp; →</a>
    </main>
  </body>
</html>
